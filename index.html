<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0d0b">
<title>쾌감 표본실</title>
<meta name="description" content="터뜨리고, 쪼개고, 쓸어내고, 닦아내는 만족감의 표본. 소리와 함께 즐기는 스트레스 해소 공간.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@300;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0d0b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e8e2d6'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="stage" aria-label="표본 화면"></canvas>
<div id="scrim"></div>

<main id="index">
  <header>
    <h1>쾌감 표본실</h1>
    <p class="sub">Specimens of Satisfaction</p>
  </header>
  <ol id="list"></ol>
  <footer>소리를 켜고 들어오세요. 점수도, 시간제한도, 실패도 없습니다.</footer>
</main>

<div id="shell" hidden>
  <a id="back" href="#/" aria-label="표본 목록으로">←</a>
  <div id="caption"></div>
  <div id="actions"></div>
  <div id="tools"></div>
  <div id="hint" aria-live="polite"></div>
</div>
<div id="nogl" hidden>이 브라우저에서는 WebGL2를 사용할 수 없어 표본을 보여드릴 수 없습니다.</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
